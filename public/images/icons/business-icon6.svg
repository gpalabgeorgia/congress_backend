<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <!-- Маркер стрелки, сидящий прямо на линии -->
    <marker id="arrow-head-coins-only" markerWidth="6" markerHeight="6" refX="2" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#C51F24"/>
    </marker>

    <!-- Маска для удаления невидимой части задней монеты -->
    <mask id="coin-only-mask">
      <!-- Все, что белое — отображается -->
      <rect x="0" y="0" width="100" height="100" fill="#ffffff" />
      <!-- Черный овал сотрет перекрываемую линию задней монеты -->
      <ellipse cx="51" cy="57" rx="11" ry="4.5" fill="#000000" />
      <path d="M 41 57 L 41 71 C 41 74 61 74 61 71 L 61 57 Z" fill="#000000" />
    </mask>
  </defs>

  <!-- Сплошной серый круг без теней и разрывов -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#e6e8eb" stroke-width="1.5" />

  <!-- Красная дуга, наложенная точно поверх серого круга -->
  <path d="M 50 8 A 42 42 0 0 1 92 50" fill="none" stroke="#C51F24" stroke-width="1.5" marker-end="url(#arrow-head-coins-only)" />

  <!-- Центрированная группа: Только Монеты -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- ЗАДНЯЯ (высокая) стопка монет с применением маски -->
    <g stroke="#5c6b73" stroke-width="1.75" mask="url(#coin-only-mask)">
      <!-- Основание стопки -->
      <path d="M 29 48 L 29 66 C 29 69.5 49 69.5 49 66 L 49 48" />
      <!-- Срезы монет -->
      <path d="M 29 54 C 29 57 49 57 49 54" />
      <path d="M 29 60 C 29 63 49 63 49 60" />
      <!-- Верхняя плоскость -->
      <ellipse cx="39" cy="48" rx="10" ry="3.5" />
    </g>
    <!-- Красная точка по центру верхней задней монеты -->
    <circle cx="39" cy="48" r="1.2" fill="#C51F24" />

    <!-- ПЕРЕДНЯЯ (низкая) стопка монет (рисуется поверх) -->
    <g stroke="#5c6b73" stroke-width="1.75">
      <!-- Основание стопки -->
      <path d="M 41 57 L 41 71 C 41 74 61 74 61 71 L 61 57" />
      <!-- Срез монеты -->
      <path d="M 41 64 C 41 67 61 67 61 64" />
      <!-- Верхняя плоскость -->
      <ellipse cx="51" cy="57" rx="10" ry="3.5" />
    </g>
    <!-- Красная точка по центру передней монеты -->
    <circle cx="51" cy="57" r="1.2" fill="#C51F24" />

  </g>
</svg>
